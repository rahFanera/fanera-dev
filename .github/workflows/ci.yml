name: CI - React Vite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Installer dépendances
      - name: Install dependencies
        run: npm install

      # 4. Linter (optionnel mais pro)
      - name: Run lint
        run: npm run lint --if-present

      # 5. Build du projet
      - name: Build project
        run: npm run build